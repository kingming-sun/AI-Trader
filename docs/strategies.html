<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略管理 - AI-Trader</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="api-config.js"></script>
    <style>
        .strategy-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }
        
        .strategy-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            width: 100%;
        }
        
        /* 响应式布局 - 根据屏幕宽度自动调整列数 */
        @media (min-width: 640px) {
            .strategy-list {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
        }
        
        @media (min-width: 768px) {
            .strategy-list {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            }
        }
        
        @media (min-width: 1024px) {
            .strategy-list {
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            }
        }
        
        @media (min-width: 1280px) {
            .strategy-list {
                grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            }
        }
        
        @media (min-width: 1536px) {
            .strategy-list {
                grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            }
        }
        
        .strategy-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            transition: all var(--transition-normal);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-width: 0; /* 防止内容溢出 */
        }
        
        .strategy-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
            border-color: var(--accent-blue);
        }
        
        .strategy-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }
        
        .strategy-title-section {
            flex: 1;
        }
        
        .paw-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .strategy-name {
            margin: 0 0 0.25rem 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .strategy-assets {
            margin: 0;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .strategy-status {
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-design {
            background: rgba(113, 128, 150, 0.2);
            color: var(--text-muted);
        }
        
        .status-backtest {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-blue);
        }
        
        .status-backtest-completed {
            background: rgba(72, 187, 120, 0.2);
            color: var(--success);
        }
        
        .status-simulate {
            background: rgba(255, 190, 11, 0.2);
            color: #ffbe0b;
        }
        
        .status-real {
            background: rgba(245, 101, 101, 0.2);
            color: var(--danger);
        }
        
        .strategy-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }
        
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .btn-run {
            background: var(--accent-blue);
            color: white;
        }
        
        .btn-run:hover {
            background: var(--accent-cyan);
        }
        
        .btn-edit {
            background: var(--secondary-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-edit:hover {
            background: var(--card-bg);
            border-color: var(--accent-blue);
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .btn-primary:hover {
            background: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }
        
        .strategy-metrics {
            margin-top: 0.5rem;
            flex: 1;
        }
        
        .strategy-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }
        
        .footer-metric {
            display: flex;
            flex-direction: column;
        }
        
        .footer-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        
        .footer-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .footer-value.positive {
            color: var(--success);
        }
        
        .footer-value.negative {
            color: var(--danger);
        }
        
        .metric-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .metric-item {
            display: flex;
            flex-direction: column;
        }
        
        .metric-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .metric-value.positive {
            color: var(--success);
        }
        
        .metric-value.negative {
            color: var(--danger);
        }
        
        .chart-container {
            margin: 0.75rem 0;
            padding: 0;
            background: transparent;
            border-radius: 6px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .chart-container canvas {
            width: 100%;
            height: 80px;
            display: block;
            max-width: 100%;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .holdings-info {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 6px;
            font-size: 0.8rem;
        }
        
        .holdings-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-bottom: 0.2rem;
        }
        
        .holdings-list {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .allocation-info {
            margin: 0.5rem 0 0.25rem 0;
        }
        
        .allocation-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            background: var(--secondary-bg);
            margin-bottom: 0.5rem;
        }
        
        .allocation-segment {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .allocation-segment.stock {
            background: var(--accent-blue);
        }
        
        .allocation-segment.cash {
            background: var(--text-muted);
        }
        
        .allocation-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .strategy-no-data {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">📊</span>
                <h1>AI-Trader</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">首页</a></li>
                <li><a href="strategies.html" class="nav-link active">策略管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="strategy-container">
            <header class="page-header">
                <h2>策略管理</h2>
                <p class="subtitle">创建、管理和运行交易策略，通过回测 → 模拟 → 实盘工作流程</p>
            </header>

            <!-- Strategy List -->
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3>策略</h3>
                    <button class="btn-primary" id="createStrategyBtn">+ 创建新策略</button>
                </div>
                
                <div class="strategy-list" id="strategyList">
                    <!-- Strategies will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>AI-Trader &copy; 2025 | AI驱动交易代理基准测试</p>
    </footer>

    <script src="assets/js/strategy-manager.js?v=5"></script>
</body>
</html>
