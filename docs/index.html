<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Trader - AI交易代理基准测试</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="api-config.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">📊</span>
                <h1>AI-Trader</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">资产演变</a></li>
                <li><a href="portfolio.html" class="nav-link">投资组合分析</a></li>
                <li><a href="config.html" class="nav-link">配置管理</a></li>
                <li><a href="strategies.html" class="nav-link">策略管理</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h2>AI-Trader 交易平台</h2>
            <p class="subtitle">AI 驱动的智能交易策略管理平台</p>
        </header>
        
        <div style="text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 12px; margin: 2rem 0; border: 1px solid var(--border-color);">
            <h3 style="color: var(--accent-blue); margin-bottom: 1rem;">🚀 欢迎使用 AI-Trader</h3>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">
                这是一个全新的交易策略管理平台。<br>
                请访问 <a href="strategies.html" style="color: var(--accent-cyan); text-decoration: underline;">策略管理</a> 页面来创建和管理你的交易策略。
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="strategies.html" style="background: var(--accent-blue); color: white; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.3s;">
                    📊 策略管理
                </a>
                <a href="config.html" style="background: var(--secondary-bg); color: var(--text-primary); padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 500; border: 1px solid var(--border-color); transition: all 0.3s;">
                    ⚙️ 配置管理
                </a>
                <a href="services.html" style="background: var(--secondary-bg); color: var(--text-primary); padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 500; border: 1px solid var(--border-color); transition: all 0.3s;">
                    🔧 服务状态
                </a>
            </div>
        </div>


        <div class="loading-overlay hidden" id="loadingOverlay">
            <div class="spinner"></div>
            <p>正在加载交易数据...</p>
            <p id="loadingProgress" style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;">请稍候...</p>
        </div>

        <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
            ↑
        </button>
    </main>

    <footer class="footer">
        <p>AI-Trader &copy; 2025 | AI驱动交易代理基准测试</p>
    </footer>

    <script>
        // Ensure loading overlay is hidden on page load
        document.addEventListener('DOMContentLoaded', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            if (loadingOverlay) {
                loadingOverlay.classList.add('hidden');
            }
            console.log('✅ AI-Trader Platform loaded successfully');
            console.log('📍 Navigate to strategies.html to manage your trading strategies');
        });
    </script>
</body>
</html>
